syntax = "proto3";

package message;

enum MessageType {
  MESSAGE_UNSPECIFIED = 0;
  MESSAGE_CLIENT_CONFIGURE_SESSION = 1;
  MESSAGE_SERVER_CONFIRM_SESSION = 2;
  MESSAGE_CLIENT_AUDIO_INPUT = 3;
  MESSAGE_SERVER_ERROR = 4;
  MESSAGE_SERVER_RESPONSE_MOTION = 5;
  MESSAGE_CLIENT_INTERRUPT = 6;
}

enum AudioFormat {
  AUDIO_FORMAT_PCM_S16LE = 0;
  AUDIO_FORMAT_OGG_OPUS = 1;
}

message MotionFrame {
  repeated float expr = 1 [packed = true];
  repeated float body_pose = 2 [packed = true];
  repeated float jaw_pose = 3 [packed = true];
  repeated float eyelid = 4 [packed = true];
  repeated float leye_pose = 5 [packed = true];
  repeated float reye_pose = 6 [packed = true];
  repeated float emotion_weights = 7 [packed = true];
}

message MotionAnimation {
  repeated MotionFrame keyframes = 1;
}

message ClientConfigureSession {
  int32 audio_sample_rate = 1;
  AudioFormat audio_format = 2;
  TransportConfig transport = 3;
  map<string, string> extra_params = 4;
  TraceContext trace_context = 5;
}

message ServerConfirmSession {
  string connection_id = 1;
}

message TraceContext {
  string traceparent = 1;
  string tracestate = 2;
}

message ClientAudioInput {
  string req_id = 1;
  bool end = 2;
  bytes audio = 3;

  string emotion = 4;
  optional float strength = 5;
}

message ServerError {
  string connection_id = 1;
  string req_id = 2;
  int32 code = 3;
  string message = 4;
}

message ServerResponseMotion {
  string connection_id = 1;
  string req_id = 2;
  bool end = 3;
  MotionAnimation animation = 4;
  string avatar_id = 5;
  TraceContext trace_context = 6;
  string emotion = 7;
}

message ClientInterrupt {
  string req_id = 1;
}

message Message {
  MessageType type = 1;
  oneof data {
    ClientConfigureSession client_configure_session = 2;
    ServerConfirmSession server_confirm_session = 3;
    ClientAudioInput client_audio_input = 4;
    ServerError server_error = 5;
    ServerResponseMotion server_response_motion = 6;
    ClientInterrupt client_interrupt = 7;
  }
}

message TransportConfig {
  oneof destination {
    WebSocketTransportConfig websocket = 1;
    LiveKitTransportConfig livekit = 2;
    AgoraTransportConfig agora = 3;
  }
}

message WebSocketTransportConfig {}

message LiveKitTransportConfig {
  string url = 1;
  string token = 2;
  int32 idle_timeout = 3;
  string agent_identity = 4;
  map<string, string> extra_attributes = 5;
}

message AgoraTransportConfig {
  string channel_name = 1;
  string token = 2;
  uint32 uid = 3;
}
